# Render Blueprint: New > Blueprint > pick this repository > Apply.
# The database is an external PostgreSQL (Neon); its credentials are entered once in the dashboard.
services:
  - type: web
    name: webbank-lethanh-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health/readiness
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod,demo
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
