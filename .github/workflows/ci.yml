name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Integration tests use Testcontainers; Docker is available on GitHub-hosted runners.
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci
      - run: npm run lint
      - run: ../backend/mvnw -B -f ../backend/pom.xml -DskipTests package
      - run: docker compose -f ../compose.yaml up -d --wait postgres
      - name: Start local demo API
        run: |
          java -jar ../backend/target/webbank-backend-0.0.1-SNAPSHOT.jar > /tmp/webbank-api.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://localhost:8081/actuator/health/readiness; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/webbank-api.log
          exit 1
      - run: npx playwright install --with-deps chromium
      # Playwright builds the frontend and tests recovery plus real API/database transfers.
      - run: npm run test:e2e
